# Render Blueprint: only the always-on Telegram alerts watcher. The app and its API run on Vercel.
# New > Blueprint in the Render dashboard, pick this repo. Secrets marked sync: false are asked for there.
services:
  - type: worker
    name: qrow-watcher
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter # always on; free plans can't run workers or keep a disk
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
    disk:
      name: watcher-data
      mountPath: /app/watcher/data
      sizeGB: 1
