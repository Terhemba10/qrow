<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Qrow 3D intro</title>
<!-- 3D intro for demo_final.mp4 (Three.js r170, MIT). Deterministic: window.renderAt(t) draws the frame at t seconds,
     so Playwright captures it frame by frame (capture_intro.py). The Qrow wordmark's own strokes become tubes. -->
<style>
  @font-face { font-family: "General Sans"; src: url("assets/GeneralSans-Medium.otf"); font-weight: 500; }
  @font-face { font-family: "General Sans"; src: url("assets/GeneralSans-Regular.otf"); font-weight: 400; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0d0f22; }
  canvas { display: block; }
  .tag { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font: 400 40px "General Sans", system-ui, sans-serif; color: #b9bde0; letter-spacing: .01em; opacity: 0; }
  .tag b { color: #3ef0d2; font-weight: 500; }
  .kick { position: absolute; left: 0; right: 0; top: 830px; text-align: center; font: 500 20px ui-monospace, "Geist Mono", monospace; letter-spacing: .3em; color: rgba(238,240,255,.5); opacity: 0; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<div class="tag">Payments that stay safe after <b>Q-Day</b></div>
<div class="kick">QORECHAIN TESTNET · ML-DSA-87</div>
<script type="module">
import * as THREE from "three";
import { SVGLoader } from "three/addons/loaders/SVGLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const W = 1920, H = 1080;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0f22);
scene.fog = new THREE.Fog(0x0d0f22, 90, 190);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;

const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 500);

// Lighting: a soft key from above left, teal and violet rims (the brand gradient), a faint fill.
scene.add(new THREE.HemisphereLight(0x9aa4ff, 0x0d0f22, 0.35));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-30, 40, 60); scene.add(key);
const rimT = new THREE.PointLight(0x3ef0d2, 26000, 0, 1.7); rimT.position.set(-45, 22, -6); scene.add(rimT);
const rimV = new THREE.PointLight(0x9b4dff, 30000, 0, 1.7); rimV.position.set(48, -14, -4); scene.add(rimV);

// The wordmark (brand/export/logo-on-dark.svg), its strokes as geometry.
const SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 78 32">
<path id="q" d="M17.09 24.16A10 10 0 1 1 24.16 17.09C25.7 20.3 27.4 24.5 28.3 27.1C28.8 28.6 27.6 29.4 26.2 28.5C23.6 26.8 20 25.4 17.09 24.16Z" transform="translate(-1.5 -1.4) scale(1.02)"/>
<g transform="translate(9.6 0)"><path id="r1" d="M21.2 24V9.9"/><path id="r2" d="M21.2 16.2c0-4.4 2.7-6.3 6.9-6.3"/><circle id="o" cx="38.1" cy="16" r="6.3"/><path id="w" d="M48.2 9.9 52.6 22.3 57.3 11.4 62 22.3 66.4 9.9"/></g></svg>`;
const data = new SVGLoader().parse(SVG);
const CX = 39, CY = 16;
const toV = (p) => new THREE.Vector3(p.x - CX, CY - p.y, 0);

const matQ = new THREE.MeshPhysicalMaterial({ color: 0xd6dbff, metalness: 0.7, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.12, emissive: 0x1a6b66, emissiveIntensity: 0.35 });
const matRow = new THREE.MeshPhysicalMaterial({ color: 0xd6dbff, metalness: 0.6, roughness: 0.26, clearcoat: 0.8, clearcoatRoughness: 0.2 });

function strokeGroup(path, mat, radius) {
  const g = new THREE.Group();
  for (const sub of path.subPaths) {
    const pts = sub.getPoints(path.userData.node.id === "w" ? 1 : 64).map(toV);
    const closed = pts.length > 3 && pts[0].distanceTo(pts[pts.length - 1]) < 0.3;
    if (path.userData.node.id === "w" || pts.length <= 3) {
      // straight segments, round joints and caps
      for (let i = 0; i < pts.length - 1; i++) {
        const c = new THREE.LineCurve3(pts[i], pts[i + 1]);
        g.add(new THREE.Mesh(new THREE.TubeGeometry(c, 8, radius, 32, false), mat));
      }
      for (const p of pts) { const s = new THREE.Mesh(new THREE.SphereGeometry(radius, 32, 16), mat); s.position.copy(p); g.add(s); }
    } else {
      if (closed) pts.pop();
      const curve = new THREE.CatmullRomCurve3(pts, closed, "centripetal");
      g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 400, radius, 40, closed), mat));
      if (!closed) for (const p of [pts[0], pts[pts.length - 1]]) { const s = new THREE.Mesh(new THREE.SphereGeometry(radius, 32, 16), mat); s.position.copy(p); g.add(s); }
    }
  }
  return g;
}

const parts = {};
for (const p of data.paths) parts[p.userData.node.id] = strokeGroup(p, p.userData.node.id === "q" ? matQ : matRow, p.userData.node.id === "q" ? 1.7 : 1.72);
// Each part pivots around its own centre, so it can turn in place.
const word = new THREE.Group(); scene.add(word);
const pivots = {};
for (const [id, g] of Object.entries(parts)) {
  const box = new THREE.Box3().setFromObject(g), c = box.getCenter(new THREE.Vector3());
  g.position.sub(c);
  const pv = new THREE.Group(); pv.position.copy(c); pv.add(g); word.add(pv); pivots[id] = { pv, home: c.clone() };
}

// A faint dot floor for depth.
const dots = new THREE.Points(
  new THREE.BufferGeometry().setFromPoints(Array.from({ length: 41 * 21 }, (_, i) => new THREE.Vector3((i % 41 - 20) * 6, -22, (Math.floor(i / 41) - 14) * 6))),
  new THREE.PointsMaterial({ color: 0x3a3f78, size: 0.5 }));
scene.add(dots);

const clamp = (x) => Math.min(1, Math.max(0, x));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const backOut = (x) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const tag = document.querySelector(".tag"), kick = document.querySelector(".kick");

window.renderAt = (t) => {
  // Camera: a slow dolly in with a slight orbit, settling on the wordmark.
  const c = easeInOut(clamp(t / 4.2));
  const ang = THREE.MathUtils.lerp(-0.55, 0.0, c);
  const dist = THREE.MathUtils.lerp(150, 118, c);
  camera.position.set(Math.sin(ang) * dist, THREE.MathUtils.lerp(26, 8, c), Math.cos(ang) * dist);
  camera.lookAt(0, THREE.MathUtils.lerp(-4, 2, c), 0);

  // The Q turns in from behind (0 to 1.9 s), then r, o, w arrive one by one.
  const q = clamp(t / 1.9), qb = backOut(q);
  pivots.q.pv.rotation.set((1 - easeOut(q)) * 0.9, (1 - qb) * -Math.PI * 1.25, 0);
  pivots.q.pv.position.copy(pivots.q.home).add(new THREE.Vector3(0, 0, (1 - easeOut(q)) * -60));
  pivots.q.pv.scale.setScalar(0.4 + 0.6 * easeOut(q));
  ["r1", "r2", "o", "w"].forEach((id, i) => {
    const k = clamp((t - 1.1 - (id === "r2" ? 0 : i) * 0.22) / 0.9), kb = backOut(k);
    const p = pivots[id].pv;
    p.visible = k > 0;
    p.rotation.set(0, (1 - kb) * Math.PI * 0.9, 0);
    p.position.copy(pivots[id].home).add(new THREE.Vector3((1 - easeOut(k)) * 28, (1 - easeOut(k)) * -10, (1 - easeOut(k)) * 30));
    p.scale.setScalar(Math.max(0.001, easeOut(k)));
  });
  // The whole word breathes a little after landing; the rim lights sweep across it.
  word.rotation.y = Math.sin(t * 0.9) * 0.06 * clamp((t - 2.4) / 0.8);
  rimT.position.x = -45 + 30 * Math.sin(t * 0.8);
  rimV.position.x = 48 - 30 * Math.sin(t * 0.8);
  word.position.y = 4;

  tag.style.opacity = String(easeOut(clamp((t - 2.7) / 0.6)));
  tag.style.transform = `translateY(${(1 - easeOut(clamp((t - 2.7) / 0.6))) * 16}px)`;
  kick.style.opacity = String(easeOut(clamp((t - 3.1) / 0.6)));
  renderer.render(scene, camera);
};
window.renderAt(0);
window.introReady = true;
</script>
</body>
</html>
